<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brain Dump</title>
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.json" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #111; max-width: 600px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 22px; font-weight: 500; }
  #sub { font-size: 13px; color: #888; margin-top: 3px; }
  #stats { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: #888; }
  #stats .overdue { color: #c0392b; }

  #input-box { border: 0.5px solid #ccc; border-radius: 10px; padding: 12px 14px; margin: 1.75rem 0 1rem; }
  #input-box input, #input-box textarea { width: 100%; border: none; outline: none; font-family: inherit; font-size: 14px; color: #111; background: transparent; }
  #input-box textarea { resize: none; font-size: 13px; color: #666; margin-top: 8px; }
  #input-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 400px) { #input-row { flex-direction: column; align-items: stretch; } #btn-add { width: 100%; } }
      select, input[type=date] { font-size: 12px; padding: 5px 8px; border-radius: 6px; border: 0.5px solid #ccc; background: #fff; color: #111; cursor: pointer; font-family: inherit; min-width: 130px; -webkit-appearance: none; appearance: none; }
    input[type=date]::-webkit-date-and-time-value { text-align: left; }
    input[type=date]:invalid { color: #aaa; }
  #btn-add { margin-left: auto; padding: 6px 18px; border-radius: 6px; border: none; background: #111; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
  #btn-add:active { opacity: 0.8; }

  #filters { display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
  .filter-btn { font-size: 12px; padding: 4px 14px; border-radius: 20px; border: 0.5px solid #ddd; background: transparent; color: #888; cursor: pointer; font-family: inherit; }
  .filter-btn.active { border-color: #111; background: #111; color: #fff; }
  #btn-clear { margin-left: auto; font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 0.5px solid #ddd; background: transparent; color: #888; cursor: pointer; font-family: inherit; }

  #task-list { display: flex; flex-direction: column; gap: 6px; }
  .task { border: 0.5px solid #ddd; border-radius: 10px; background: #fff; overflow: hidden; transition: opacity 0.15s; }
  .task.overdue { border-color: #e74c3c; }
  .task.done { opacity: 0.45; }
  .task-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; }
  .task-row input[type=checkbox] { width: 15px; height: 15px; accent-color: #111; cursor: pointer; flex-shrink: 0; }
  .task-text { flex: 1; font-size: 14px; color: #111; }
  .task.done .task-text { text-decoration: line-through; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 0.5px solid #ddd; color: #888; flex-shrink: 0; white-space: nowrap; }
  .badge.overdue { border-color: #e74c3c; color: #c0392b; }
  .prio { font-size: 11px; color: #aaa; flex-shrink: 0; min-width: 40px; text-align: right; }
  .btn-del { background: none; border: none; cursor: pointer; color: #aaa; font-size: 18px; line-height: 1; padding: 0 2px; flex-shrink: 0; }
  .task-detail { padding: 0 14px 12px 39px; border-top: 0.5px solid #eee; display: none; }
  .task-detail.open { display: block; }
  .task-detail p { font-size: 13px; color: #666; margin-top: 10px; }
  .task-detail .meta { font-size: 12px; color: #aaa; margin-top: 6px; }

  #empty { text-align: center; color: #aaa; font-size: 14px; padding: 3rem 0; }

  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    #sub, #stats { color: #666; }
    #input-box { border-color: #333; }
    #input-box input, #input-box textarea { color: #eee; }
    #input-box textarea { color: #aaa; }
    select, input[type=date] { background: #111; color: #eee; border-color: #333; }
    #btn-add { background: #eee; color: #111; }
    .filter-btn { border-color: #333; color: #666; }
    .filter-btn.active { background: #eee; color: #111; border-color: #eee; }
    #btn-clear { border-color: #333; color: #666; }
    .task { border-color: #2a2a2a; background: #111; }
    .task-text { color: #eee; }
    .badge { border-color: #333; color: #666; }
    .btn-del { color: #444; }
    .task-detail { border-color: #222; }
    .task-detail p { color: #888; }
  }
</style>
</head>
<body>

<h1>Brain Dump</h1>
<div id="sub"></div>
<div id="stats"></div>

<div id="input-box">
  <input id="inp-text" type="text" placeholder="Apa yang ada di pikiran kamu?" />
  <textarea id="inp-note" rows="2" placeholder="Catatan tambahan… (opsional)"></textarea>
  <div id="input-row">
    <select id="inp-prio">
      <option>High</option>
      <option selected>Medium</option>
      <option>Low</option>
    </select>
    <input type="date" id="inp-due" />
    <button id="btn-add">Tambah</button>
  </div>
</div>

<div id="filters">
  <button class="filter-btn active" data-f="All">All</button>
  <button class="filter-btn" data-f="Active">Active</button>
  <button class="filter-btn" data-f="Overdue">Overdue</button>
  <button class="filter-btn" data-f="Done">Done</button>
  <button id="btn-clear" style="display:none">Hapus selesai</button>
</div>

<div id="task-list"></div>
<div id="empty" style="display:none">Belum ada task. Tulis sesuatu di atas!</div>

<script>
const STORE = "braindump_tasks";
const prioOrder = { High: 0, Medium: 1, Low: 2 };
let tasks = JSON.parse(localStorage.getItem(STORE) || "[]");
let filter = "All";
let expanded = null;

function save() { localStorage.setItem(STORE, JSON.stringify(tasks)); }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function isOverdue(due, done) {
  if (!due || done) return false;
  return due < todayStr();
}

function daysLeft(due) {
  if (!due) return null;
  const [y,m,d] = due.split("-").map(Number);
  const dueDate = new Date(y, m-1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((dueDate - today) / 86400000);
  const label = dueDate.toLocaleDateString("id-ID", { day:"numeric", month:"short" });
  if (diff === 0) return `Hari ini · ${label}`;
  if (diff === 1) return `Besok · ${label}`;
  if (diff < 0) return `${Math.abs(diff)} hari telat · ${label}`;
  return `${diff} hari lagi · ${label}`;
}

function formatDate(iso) {
  if (!iso) return null;
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
}

function render() {
  // header
  document.getElementById("sub").textContent = new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const done = tasks.filter(t=>t.done).length;
  const overdue = tasks.filter(t=>isOverdue(t.due,t.done)).length;
  const active = tasks.length - done;
  document.getElementById("stats").innerHTML =
    `<span>${active} Active</span>` +
    (overdue > 0 ? `<span class="overdue">${overdue} Overdue</span>` : "") +
    `<span>${done} Done</span>`;

  // filters
  document.querySelectorAll(".filter-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.f === filter);
    if (b.dataset.f === "Overdue") b.textContent = overdue > 0 ? `Overdue (${overdue})` : "Overdue";
  });
  document.getElementById("btn-clear").style.display = done > 0 ? "" : "none";

  // tasks
  let visible = tasks
    .filter(t => {
      if (filter === "All") return true;
      if (filter === "Active") return !t.done && !isOverdue(t.due, t.done);
      if (filter === "Overdue") return isOverdue(t.due, t.done);
      if (filter === "Done") return t.done;
    })
    .sort((a,b) => {
      const ao = isOverdue(a.due,a.done), bo = isOverdue(b.due,b.done);
      if (ao !== bo) return ao ? -1 : 1;
      return prioOrder[a.priority] - prioOrder[b.priority];
    });

  const list = document.getElementById("task-list");
  const empty = document.getElementById("empty");
  list.innerHTML = "";

  if (visible.length === 0) { empty.style.display=""; return; }
  empty.style.display = "none";

  visible.forEach(t => {
    const ov = isOverdue(t.due, t.done);
    const dl = daysLeft(t.due);
    const isExp = expanded === t.id;

    const el = document.createElement("div");
    el.className = "task" + (ov?" overdue":"") + (t.done?" done":"");
    el.innerHTML = `
      <div class="task-row">
        <input type="checkbox" ${t.done?"checked":""} data-id="${t.id}" />
        <span class="task-text">${t.text}</span>
        ${dl ? `<span class="badge${ov?" overdue":""}">${dl}</span>` : ""}
        <span class="prio">${t.priority}</span>
        <button class="btn-del" data-id="${t.id}">×</button>
      </div>
      <div class="task-detail${isExp?" open":""}">
        ${t.note ? `<p>${t.note}</p>` : ""}
        <p class="meta">Dibuat: ${formatDate(t.created)}${t.due?` · Due: ${formatDate(t.due)}`:""}</p>
      </div>`;

    el.querySelector(".task-text").addEventListener("click", () => {
      expanded = expanded === t.id ? null : t.id;
      render();
    });
    el.querySelector("input[type=checkbox]").addEventListener("change", e => {
      tasks = tasks.map(x => x.id===t.id ? {...x, done: e.target.checked} : x);
      save(); render();
    });
    el.querySelector(".btn-del").addEventListener("click", e => {
      e.stopPropagation();
      tasks = tasks.filter(x => x.id !== t.id);
      if (expanded === t.id) expanded = null;
      save(); render();
    });

    list.appendChild(el);
  });
}

document.getElementById("btn-add").addEventListener("click", () => {
  const text = document.getElementById("inp-text").value.trim();
  if (!text) return;
  tasks.unshift({
    id: Date.now(),
    text,
    note: document.getElementById("inp-note").value.trim(),
    priority: document.getElementById("inp-prio").value,
    due: document.getElementById("inp-due").value || null,
    done: false,
    created: todayStr()
  });
  save(); render();
  document.getElementById("inp-text").value = "";
  document.getElementById("inp-note").value = "";
  document.getElementById("inp-due").value = "";
  document.getElementById("inp-prio").value = "Medium";
});

document.getElementById("inp-text").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("btn-add").click(); }
});

document.querySelectorAll(".filter-btn").forEach(b => {
  b.addEventListener("click", () => { filter = b.dataset.f; render(); });
});

document.getElementById("btn-clear").addEventListener("click", () => {
  tasks = tasks.filter(t => !t.done); save(); render();
});

render();
</script>
</body>
</html>
